<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halo Nite — Records</title>
<link rel="stylesheet" href="css/halo.css">
<style>
.rec-section { display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:8px; }
@media(max-width:800px){ .rec-section{grid-template-columns:1fr;} }
.rec-group { background:var(--surface);border:1px solid var(--border);padding:0; }
.rec-group h3 { font-family:var(--font-head);font-size:.84rem;font-weight:600;letter-spacing:.2em;padding:9px 14px;border-bottom:1px solid; }
.rec-group h3.pos { color:#4ade80;border-bottom-color:#4ade8044; }
.rec-group h3.neg { color:#f87171;border-bottom-color:#f8717144; }
.rec-item { padding:10px 14px;border-bottom:1px solid var(--border2); }
.rec-item:last-child { border-bottom:none; }
.rec-label { font-size:.72rem;letter-spacing:.2em;color:var(--text-dim);font-family:var(--font-head);font-weight:600;margin-bottom:4px; }
.rec-instance { display:flex;align-items:center;gap:10px;margin-top:5px; }
.rec-instance:first-child { margin-top:0; }
.rec-val { font-family:var(--font-head);font-size:1.5rem;font-weight:700;line-height:1;min-width:48px;text-align:right;flex-shrink:0; }
.rec-info .ri-holder { font-family:var(--font-head);font-size:.95rem;font-weight:600; }
.rec-info .ri-meta   { font-size:.72rem;color:var(--text-dim);margin-top:1px; }
.rec-divider { border:none;border-top:1px dashed var(--border);margin:6px 0; }
.filter-row select { font-size:.88rem; }
</style>
</head>
<body>
<div id="nav"></div>
<main>
<div id="loading"><span>LOADING...</span></div>
<div id="content" style="display:none">
  <h1 class="page-title">Season Records</h1>
  <p class="page-subtitle" id="page-sub"></p>

  <div id="sh-plr-rec"></div>
  <div class="rec-section">
    <div class="rec-group" style="border-left:3px solid #4ade8066"><h3 class="pos">PLAYER — POSITIVE</h3><div id="pp-recs"></div></div>
    <div class="rec-group" style="border-left:3px solid #f8717166"><h3 class="neg">PLAYER — NEGATIVE</h3><div id="pn-recs"></div></div>
  </div>

  <div id="sh-team-rec"></div>
  <div class="rec-section">
    <div class="rec-group" style="border-left:3px solid #4ade8066"><h3 class="pos">TEAM — POSITIVE</h3><div id="tp-recs"></div></div>
    <div class="rec-group" style="border-left:3px solid #f8717166"><h3 class="neg">TEAM — NEGATIVE</h3><div id="tn-recs"></div></div>
  </div>

  <div id="sh-pb"></div>
  <div class="filter-row">
    <label>RECORD</label><select id="pb-rec"><option value="">ALL RECORDS</option></select>
    <label>PLAYER</label><select id="pb-plr"><option value="">ALL PLAYERS</option></select>
    <label>MAP</label><select id="pb-map"><option value="">ALL MAPS</option></select>
    <label>MATCHUP</label><select id="pb-mu"><option value="">ALL MATCHUPS</option></select>
  </div>
  <div class="box tbl-wrap" style="padding:0">
    <table>
      <thead><tr>
        <th>RECORD</th><th>PLAYER</th><th class="r">VALUE</th>
        <th class="r">GAME</th><th class="r">NITE</th><th>MAP</th><th>MATCHUP</th>
      </tr></thead>
      <tbody id="pb-body"></tbody>
    </table>
  </div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="js/common.js"></script>
<script>
renderNav('records.html', null);

// PB categories — defined once at module scope
const PB_CATS_POS = [
  { key:'most_points',       label:'Most Points',           field:'score',             minimize:false },
  { key:'most_kills',        label:'Most Kills',            field:'kills',             minimize:false },
  { key:'most_assists',      label:'Most Assists',          field:'assists',           minimize:false },
  { key:'fewest_deaths',     label:'Fewest Deaths',         field:'deaths',            minimize:true  },
  { key:'most_weapon_kills', label:'Most Weapon Kills',     field:'weapon_kills',      minimize:false },
  { key:'most_grenade_kills',label:'Most Grenade Kills',    field:'grenade_kills',     minimize:false },
  { key:'most_melee_kills',  label:'Most Melee Kills',      field:'melee_kills',       minimize:false },
  { key:'most_other_kills',  label:'Most Other Kills',      field:'other_kills',       minimize:false },
  { key:'greatest_spread',   label:'Greatest K/D Spread',   field:'kd_spread',         minimize:false },
  { key:'longest_spree',     label:'Longest Killing Spree', field:'most_kills_in_row', minimize:false },
];
const PB_CATS_NEG = [
  { key:'fewest_points',  label:'Fewest Points',  field:'score',     minimize:true  },
  { key:'fewest_kills',   label:'Fewest Kills',   field:'kills',     minimize:true  },
  { key:'most_deaths',    label:'Most Deaths',    field:'deaths',    minimize:false },
  { key:'lowest_spread',  label:'Lowest K/D Spread', field:'kd_spread', minimize:true },
  { key:'most_betrayals', label:'Most Betrayals', field:'betrayals', minimize:false },
  { key:'most_suicides',  label:'Most Suicides',  field:'suicides',  minimize:false },
  { key:'most_betray_sui',label:'Most Betrayals+Suicides', field:'_betray_sui', minimize:false },
];
const ALL_PB_CATS = [...PB_CATS_POS, ...PB_CATS_NEG];

loadStats().then(data => {
  renderNav('records.html', data);
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';

  const sd = getSeasonData(data);
  const { players } = data;
  const { records, maps, matchups } = sd;
  const isLifetime = isMultiSeasonView();
  const combineSui = sd.combine_suicides;

  document.getElementById('page-sub').textContent = `${getCurrentSeason()} — ALL-TIME BESTS`;
  document.getElementById('sh-plr-rec').innerHTML  = sectionHdr('PLAYER RECORDS');
  document.getElementById('sh-team-rec').innerHTML = sectionHdr('TEAM RECORDS');
  document.getElementById('sh-pb').innerHTML       = sectionHdr('PERSONAL BEST LOG');

  function fmtVal(v) {
    return typeof v === 'number' && v % 1 !== 0 ? v.toFixed(2) : v;
  }

  function recItem(label, rec, color) {
    if (!rec || rec.value === null || !rec.instances?.length) return '';
    const val = fmtVal(rec.value);
    const instancesHtml = rec.instances.map((inst, i) => {
      const nameHtml = inst.player
        ? `<span style="color:${pc(inst.player,data)}">${playerDot(inst.player,data)}${inst.display||inst.player}</span>`
        : (inst.team ? teamBadge(inst.team, teamColor(inst.team,data)) : '—');
      const meta = `G${inst.game_num_season} · Nite ${inst.halonite_num}${isLifetime?' · S'+inst.season:''} · ${inst.map||''}`;
      return `${i>0?'<hr class="rec-divider">':''}
        <div class="rec-instance">
          <div class="rec-val" style="color:${color};text-shadow:0 0 8px ${color}44">${i===0?val:''}</div>
          <div class="rec-info">
            <div class="ri-holder">${nameHtml}</div>
            <div class="ri-meta">${meta}</div>
          </div>
        </div>`;
    }).join('');
    return `<div class="rec-item"><div class="rec-label">${label}</div>${instancesHtml}</div>`;
  }

  // Player records
  const ppMap = {
    most_points:'MOST POINTS', most_kills:'MOST KILLS', most_assists:'MOST ASSISTS',
    fewest_deaths:'FEWEST DEATHS', most_weapon_kills:'MOST WEAPON KILLS',
    most_grenade_kills:'MOST GRENADE KILLS', most_melee_kills:'MOST MELEE KILLS',
    most_other_kills:'MOST OTHER KILLS', greatest_spread:'GREATEST K/D SPREAD', longest_spree:'LONGEST KILL SPREE',
  };
  const pnMap = {
    fewest_points:'FEWEST POINTS', fewest_kills:'FEWEST KILLS',
    most_deaths:'MOST DEATHS', lowest_spread:'LOWEST K/D SPREAD',
    ...(combineSui ? {most_betray_suicide:'MOST BETRAY+SUICIDES'}
                   : {most_betrayals:'MOST BETRAYALS', most_suicides:'MOST SUICIDES'}),
  };

  document.getElementById('pp-recs').innerHTML = Object.entries(ppMap).map(([k,l])=>recItem(l,records.player_positive[k],'#4ade80')).join('');
  document.getElementById('pn-recs').innerHTML = Object.entries(pnMap).map(([k,l])=>recItem(l,records.player_negative[k],'#f87171')).join('');

  const tpMap = { most_kills:'MOST KILLS', most_assists:'MOST ASSISTS', fewest_deaths:'FEWEST DEATHS', greatest_spread:'GREATEST SPREAD' };
  const tnMap = { fewest_points:'FEWEST POINTS', fewest_kills:'FEWEST KILLS', most_deaths:'MOST DEATHS', lowest_spread:'LOWEST SPREAD' };
  document.getElementById('tp-recs').innerHTML = Object.entries(tpMap).map(([k,l])=>recItem(l,records.team_positive[k],'#4ade80')).join('');
  document.getElementById('tn-recs').innerHTML = Object.entries(tnMap).map(([k,l])=>recItem(l,records.team_negative[k],'#f87171')).join('');

  // Populate PB filters
  const pbRec = document.getElementById('pb-rec');
  // Show combined or separate suicide/betrayal options based on season
  ALL_PB_CATS.forEach(({ key, label }) => {
    if (key === 'most_suicides' && combineSui) return;    // combined mode: skip separate
    if (key === 'most_betrayals' && combineSui) return;   // combined mode: skip separate
    if (key === 'most_betray_sui' && !combineSui) return; // separate mode: skip combined
    const o = document.createElement('option');
    o.value = key; o.textContent = label;
    pbRec.appendChild(o);
  });

  players.forEach(p => {
    const o = document.createElement('option'); o.value=p; o.textContent=dn(p,data);
    document.getElementById('pb-plr').appendChild(o);
  });
  Object.keys(maps).sort().forEach(m => {
    const o = document.createElement('option'); o.value=o.textContent=m;
    document.getElementById('pb-map').appendChild(o);
  });
  Object.keys(matchups).forEach(m => {
    const o = document.createElement('option'); o.value=o.textContent=m;
    document.getElementById('pb-mu').appendChild(o);
  });

  // Wire up filter events — use 'change' event listeners (not inline onchange)
  ['pb-rec','pb-plr','pb-map','pb-mu'].forEach(id => {
    document.getElementById(id).addEventListener('change', () => renderPB(data, sd, players, isLifetime, combineSui));
  });

  // Initial render
  renderPB(data, sd, players, isLifetime, combineSui);
});

function renderPB(data, sd, players, isLifetime, combineSui) {
  const catF = document.getElementById('pb-rec').value;
  const plrF = document.getElementById('pb-plr').value;
  const mapF = document.getElementById('pb-map').value;
  const muF  = document.getElementById('pb-mu').value;

  // Determine which categories to show
  const catsToShow = ALL_PB_CATS.filter(c => {
    if (c.key === 'most_suicides'   && combineSui) return false;
    if (c.key === 'most_betrayals'  && combineSui) return false;
    if (c.key === 'most_betray_sui' && !combineSui) return false;
    if (catF && c.key !== catF) return false;
    return true;
  });

  const plrsToShow = plrF ? [plrF] : players;

  // Filter games by map and matchup
  const filteredGames = sd.games.filter(g =>
    (!mapF || g.map === mapF) &&
    (!muF  || g.matchup === muF)
  );

  // For each (category, player): find personal best within filtered games
  const rows = [];

  catsToShow.forEach(({ key, label, field, minimize }) => {
    plrsToShow.forEach(p => {
      let bestVal = minimize ? Infinity : -Infinity;
      let bestGames = [];

      filteredGames.forEach(g => {
        const ps = g.players[p];
        if (!ps) return;
        let val;
        if (field === '_betray_sui') {
          val = (ps.betrayals||0) + (ps.suicides||0);
        } else {
          val = ps[field];
        }
        if (val === undefined || val === null) return;
        const better = minimize ? (val < bestVal) : (val > bestVal);
        if (better) { bestVal = val; bestGames = [g]; }
        else if (val === bestVal) { bestGames.push(g); }
      });

      if (bestGames.length === 0 || !isFinite(bestVal)) return;

      bestGames.forEach(g => {
        const gn = isLifetime ? (g.game_num_lifetime||g.game_num_season) : g.game_num_season;
        rows.push({ label, player: p, value: bestVal, gameNum: gn, nite: g.halonite_num, map: g.map, matchup: g.matchup });
      });
    });
  });

  // Sort: by category label, then by player
  rows.sort((a, b) => {
    if (a.label !== b.label) return a.label.localeCompare(b.label);
    return a.player.localeCompare(b.player);
  });

  const tbody = document.getElementById('pb-body');
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:20px;color:var(--text-dim);font-family:var(--font-head)">NO RESULTS MATCH FILTERS</td></tr>`;
    return;
  }

  tbody.innerHTML = rows.map(({ label, player, value, gameNum, nite, map, matchup }) => {
    const c = pc(player, data);
    const v = fmtVal(value);
    return `<tr>
      <td style="font-family:var(--font-head);font-size:.9rem;font-weight:600">${label}</td>
      <td><span class="player-tag">${playerDot(player,data)}<span style="color:${c}">${dn(player,data)}</span></span></td>
      <td class="r teal" style="font-family:var(--font-head);font-weight:700;font-size:.95rem">${v}</td>
      <td class="r dim">${gameNum}</td>
      <td class="r dim">${nite}</td>
      <td>${map||''}</td>
      <td class="dim">${matchup||''}</td>
    </tr>`;
  }).join('');

  function fmtVal(v) {
    return typeof v === 'number' && v % 1 !== 0 ? v.toFixed(2) : v;
  }
}
</script>
</body>
</html>
