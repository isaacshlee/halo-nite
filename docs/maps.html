<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halo Nite — Maps</title>
<link rel="stylesheet" href="css/halo.css">
<style>
.two-tbl-row { display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px; }
@media(max-width:900px){ .two-tbl-row{grid-template-columns:1fr;} }
.mtbl { width:100%;border-collapse:collapse;font-size:.82rem; }
.mtbl th { font-family:var(--font-head);font-size:.66rem;font-weight:600;letter-spacing:.13em;color:var(--teal);padding:5px 8px;background:var(--surface);border-bottom:1px solid var(--teal-dim);white-space:nowrap;text-align:right; }
.mtbl th:first-child,.mtbl td:first-child { text-align:left; }
.mtbl td { padding:5px 8px;border-bottom:1px solid var(--border2);white-space:nowrap;text-align:right; }
.mtbl tr:hover td { background:var(--teal-glow2); }
.chart-row-2 { display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px; }
.chart-row-3 { display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px; }
.chart-row-4 { display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px; }
@media(max-width:900px){ .chart-row-2{grid-template-columns:1fr;} .chart-row-3{grid-template-columns:1fr 1fr;} }
.chart-box-tall { background:var(--surface);border:1px solid var(--border);padding:14px; overflow:visible; }
.chart-box-tall h3 { font-family:var(--font-head);font-size:.82rem;font-weight:600;letter-spacing:.2em;color:var(--text-dim);margin-bottom:10px; }
/* Charts are rendered at explicit pixel dimensions (responsive:false) */
.map-card { background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--teal-dim);padding:9px 12px;cursor:pointer;transition:background .12s; }
.map-card:hover,.map-card.sel { background:var(--teal-glow2);border-left-color:var(--teal); }
.map-card .mc-name { font-family:var(--font-head);font-weight:700;font-size:.92rem; }
.map-card .mc-g { font-size:.66rem;letter-spacing:.14em;color:var(--text-dim); }
.maps-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px;margin-bottom:18px; }
.map-detail { background:var(--surface);border:1px solid var(--border);border-top:2px solid var(--teal-dim);padding:16px; }
.map-detail-name { font-family:var(--font-head);font-size:1.4rem;font-weight:700;color:var(--teal);text-shadow:0 0 12px var(--teal-glow);letter-spacing:.08em;margin-bottom:12px; }
.hbar-wrap { margin-bottom:5px; }
.hbar-label { display:flex;justify-content:space-between;font-size:.7rem;letter-spacing:.1em;color:var(--text-dim);margin-bottom:2px; }
.hbar-bg { height:4px;background:var(--border2); }
.hbar-fill { height:100%;background:linear-gradient(90deg,var(--teal-dim),var(--teal));transition:width .4s; }
</style>
</head>
<body>
<div id="nav"></div>
<main>
<div id="loading"><span>LOADING...</span></div>
<div id="content" style="display:none">
  <h1 class="page-title">Map Stats</h1>
  <p class="page-subtitle" id="page-sub"></p>

  <div id="sh-overview"></div>
  <div class="two-tbl-row">
    <div class="box tbl-wrap" style="padding:0">
      <table class="mtbl" id="tbl1"><thead id="tbl1-hdr"></thead><tbody id="tbl1-body"></tbody></table>
    </div>
    <div class="box tbl-wrap" style="padding:0">
      <table class="mtbl" id="tbl2"><thead id="tbl2-hdr"></thead><tbody id="tbl2-body"></tbody></table>
    </div>
  </div>

  <div id="sh-charts"></div>
  <div class="chart-row-3" id="chart-row1"></div>
  <div class="chart-row-3" id="chart-row2"></div>
  <div class="chart-row-3" id="chart-row3"></div>
  <div class="chart-row-3" id="chart-row4"></div>

  <div id="sh-detail"></div>
  <div class="maps-grid" id="maps-grid"></div>
  <div id="map-detail"></div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="js/common.js"></script>
<script>
renderNav('maps.html', null);
let globalData = null;
let _mapEntries = null;
let _mapSortState = null; // null or {type:'player'|'team', key:string}

function _gradC(val, mn, mx) {
  if (mn === mx) return '#9ac8d8';
  const t = Math.max(0, Math.min(1, (val-mn)/(mx-mn)));
  const r = Math.round(0xf8 + t*(0x4a-0xf8));
  const g = Math.round(0x71 + t*(0xde-0x71));
  const b = Math.round(0x71 + t*(0x80-0x71));
  return `rgb(${r},${g},${b})`;
}

function sortByMapCol(type, key) {
  if (_mapSortState && _mapSortState.type===type && _mapSortState.key===key) {
    _mapSortState = null;
  } else {
    _mapSortState = {type, key};
  }
  renderMapTableBodies();
}

function getSortedMapEntries() {
  if (!_mapSortState || !_mapEntries) return _mapEntries;
  const {type, key} = _mapSortState;
  const mn2 = ['Blue vs Red','Pink vs Green','Gold vs Brown'];
  return [..._mapEntries].sort((a,b) => {
    let av=0, bv=0;
    if (type==='player') {
      av = a[1].player_win_pct[key]||0;
      bv = b[1].player_win_pct[key]||0;
    } else {
      for (const muName of mn2) {
        const muA=(a[1].mu_breakdown||{})[muName], muB=(b[1].mu_breakdown||{})[muName];
        const [ta,tb]=muName.split(' vs ');
        if (ta===key) { if(muA) av=muA.a_win_pct; if(muB) bv=muB.a_win_pct; break; }
        if (tb===key) { if(muA) av=muA.b_win_pct; if(muB) bv=muB.b_win_pct; break; }
      }
    }
    return bv - av;
  });
}

function renderMapTableBodies() {
  const data = globalData;
  if (!data || !_mapEntries) return;
  const sd = getSeasonData(data);
  const { players } = data;
  const sortedPlayers = [...players].sort();
  const mu_pairs = [['Blue','Red'],['Pink','Green'],['Gold','Brown']];
  const mu_names = ['Blue vs Red','Pink vs Green','Gold vs Brown'];
  const entries = getSortedMapEntries();

  // Per-player gradient range
  const plrRange = {};
  sortedPlayers.forEach(p => {
    const vals = _mapEntries.map(([,m]) => m.player_win_pct[p]||0);
    plrRange[p] = [Math.min(...vals), Math.max(...vals)];
  });

  // Per-team gradient range (across all maps, ignoring sort)
  const teamRange = {};
  mu_pairs.forEach(([a,b],i) => {
    const muName = mu_names[i];
    const aVals=[], bVals=[];
    _mapEntries.forEach(([,m]) => {
      const mu=(m.mu_breakdown||{})[muName];
      if (mu) { aVals.push(mu.a_win_pct); bVals.push(mu.b_win_pct); }
    });
    if (aVals.length) teamRange[a]=[Math.min(...aVals),Math.max(...aVals)];
    if (bVals.length) teamRange[b]=[Math.min(...bVals),Math.max(...bVals)];
  });

  document.getElementById('tbl1-body').innerHTML = entries.map(([mn,m])=>`<tr>
    <td style="font-family:var(--font-head);font-weight:600">${mn}</td>
    <td class="r dim">${m.games}</td>
    ${sortedPlayers.map(p=>{
      const w=m.player_win_pct[p]||0;
      const [lo,hi]=plrRange[p];
      return `<td class="r" style="color:${_gradC(w,lo,hi)}">${w}%</td>`;
    }).join('')}
  </tr>`).join('');

  document.getElementById('tbl2-body').innerHTML = entries.map(([mn,m])=>`<tr>
    <td style="font-family:var(--font-head);font-weight:600">${mn}</td>
    ${mu_pairs.map(([a,b],i)=>{
      const muName=mu_names[i];
      const mu=(m.mu_breakdown||{})[muName];
      if (!mu) return `<td class="r dim">—</td><td class="r dim">—</td><td class="r dim">—</td>`;
      const aw=mu.a_win_pct, bw=mu.b_win_pct;
      const [alo,ahi]=teamRange[a]||[aw,aw];
      const [blo,bhi]=teamRange[b]||[bw,bw];
      return `<td class="r dim">${mu.games}</td>
              <td class="r" style="color:${_gradC(aw,alo,ahi)}">${aw}%</td>
              <td class="r" style="color:${_gradC(bw,blo,bhi)}">${bw}%</td>`;
    }).join('')}
  </tr>`).join('');

  // Update sort indicator on headers
  document.querySelectorAll('[data-sort-type]').forEach(th => {
    const active = _mapSortState && th.dataset.sortType===_mapSortState.type && th.dataset.sortKey===_mapSortState.key;
    th.style.textDecoration = active ? 'underline' : '';
    th.style.opacity = active ? '1' : '';
  });
}

loadStats().then(data => {
  globalData = data;
  renderNav('maps.html', data);
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';

  const sd = getSeasonData(data);
  const { players } = data;
  const { maps, matchups } = sd;
  _mapEntries = Object.entries(maps); // alphabetical
  const mapEntries = _mapEntries;
  const mapNames = mapEntries.map(([n])=>n);
  const sortedPlayers = [...players].sort();

  document.getElementById('page-sub').textContent = `${getCurrentSeason()} — ${mapNames.length} MAPS`;
  document.getElementById('sh-overview').innerHTML = sectionHdr('ALL MAPS OVERVIEW');
  document.getElementById('sh-charts').innerHTML   = sectionHdr('CHART BREAKDOWNS');
  document.getElementById('sh-detail').innerHTML   = sectionHdr('SELECT A MAP FOR DETAIL');

  const mu_pairs = [['Blue','Red'],['Pink','Green'],['Gold','Brown']];
  const mu_names = ['Blue vs Red','Pink vs Green','Gold vs Brown'];

  // ── Table headers (static, with sort click handlers) ──
  document.getElementById('tbl1-hdr').innerHTML = `<tr>
    <th>MAP</th><th class="r">G</th>
    ${sortedPlayers.map(p=>`<th class="r" style="color:${pc(p,data)};cursor:pointer" data-sort-type="player" data-sort-key="${p}" onclick="sortByMapCol('player','${p}')">${dn(p,data)} W%</th>`).join('')}
  </tr>`;
  document.getElementById('tbl2-hdr').innerHTML = `<tr>
    <th>MAP</th>
    ${mu_pairs.map(([a,b],i)=>{
      const ca=teamColor(a,data), cb=teamColor(b,data);
      return `<th class="r dim" style="font-size:.55rem">G</th>
              <th class="r" style="color:${ca};cursor:pointer" data-sort-type="team" data-sort-key="${a}" onclick="sortByMapCol('team','${a}')">${a}%</th>
              <th class="r" style="color:${cb};cursor:pointer" data-sort-type="team" data-sort-key="${b}" onclick="sortByMapCol('team','${b}')">${b}%</th>`;
    }).join('')}
  </tr>`;

  renderMapTableBodies();

  // ── Charts ──
  const barC = i => `hsl(${185+i*7},80%,${45+(i%3)*7}%)`;
  const bCs  = mapNames.map((_,i)=>barC(i));
  const chartH = 420;

  function chartBox(id, title) {
    return `<div class="chart-box-tall"><h3>${title}</h3><canvas id="${id}"></canvas></div>`;
  }

  document.getElementById('chart-row1').innerHTML =
    chartBox('ch-mov','AVG MARGIN OF VICTORY') + chartBox('ch-time','AVG GAME TIME (MIN)') + chartBox('ch-k','AVG KILLS / PLAYER');
  document.getElementById('chart-row2').innerHTML =
    chartBox('ch-ast','ASSIST %') + chartBox('ch-bs','AVG BETRAY + SUICIDE') + chartBox('ch-wk','WEAPON KILL %');
  document.getElementById('chart-row3').innerHTML =
    chartBox('ch-gk','GRENADE KILL %') + chartBox('ch-mk','MELEE KILL %') + chartBox('ch-ok','OTHER KILL %');
  document.getElementById('chart-row4').innerHTML =
    chartBox('ch-hof','HILL OFFENSE KILL %') + chartBox('ch-hdf','HILL DEFENSE KILL %') + chartBox('ch-hrat','HILL OFF / DEF RATIO');

  const chartSpecs = [
    ['ch-mov',  mapEntries.map(([,m])=>m.avg_mov),                                                            ''],
    ['ch-time', mapEntries.map(([,m])=>+(m.avg_seconds/60).toFixed(1)),                                        ''],
    ['ch-k',    mapEntries.map(([,m])=>m.avg_kills_per_player),                                                ''],
    ['ch-ast',  mapEntries.map(([,m])=>m.avg_assists_pct),                                                     '%'],
    ['ch-bs',   mapEntries.map(([,m])=>m.avg_betray_suicide),                                                  ''],
    ['ch-wk',   mapEntries.map(([,m])=>m.weapon_pct),                                                         '%'],
    ['ch-gk',   mapEntries.map(([,m])=>m.grenade_pct),                                                        '%'],
    ['ch-mk',   mapEntries.map(([,m])=>m.melee_pct),                                                          '%'],
    ['ch-ok',   mapEntries.map(([,m])=>m.other_pct),                                                          '%'],
    ['ch-hof',  mapEntries.map(([,m])=>m.hill_offense_pct||0),                                                '%'],
    ['ch-hdf',  mapEntries.map(([,m])=>m.hill_defense_pct||0),                                                '%'],
    ['ch-hrat', mapEntries.map(([,m])=>+(((m.hill_offense||0)/((m.hill_defense||0)||1)).toFixed(2))),          ''],
  ];

  // Defer chart creation one frame so the DOM is fully laid out before measuring widths.
  // Use new Chart() directly (not makeChart) to guarantee responsive:false takes effect.
  requestAnimationFrame(() => {
    chartSpecs.forEach(([id, vals, suf]) => {
      const canvas = document.getElementById(id);
      if (!canvas) return;
      const w = Math.round(canvas.closest('.chart-box-tall').getBoundingClientRect().width - 28);
      canvas.width  = Math.max(300, w);
      canvas.height = chartH;
      new Chart(canvas, {
        type: 'bar',
        data: {
          labels: mapNames,
          datasets: [{ data: vals, backgroundColor: bCs.map(c=>c+'99'), borderColor: bCs, borderWidth: 1 }],
        },
        options: {
          responsive: false,
          maintainAspectRatio: false,
          animation: false,
          indexAxis: 'y',
          plugins: { legend: { display: false }, tooltip: CHART_DEFAULTS.plugins.tooltip },
          scales: {
            y: { ticks: { color:'#9ac8d8', font:{ family:'Share Tech Mono', size:12 }, autoSkip:false }, grid:{ color:'rgba(26,58,68,.35)' } },
            x: { ticks: { color:'#6090a2', font:{ family:'Share Tech Mono', size:12 }, callback: v => v+(suf||'') }, grid:{ color:'rgba(26,58,68,.35)' } },
          },
        },
      });
    });
  });

  // ── Map cards ──
  document.getElementById('maps-grid').innerHTML = mapEntries.map(([mn,m])=>
    `<div class="map-card" id="mc-${mn.replace(/[^a-z0-9]/gi,'_')}" onclick="showMap('${mn.replace(/'/g,"\\'")}')">
      <div class="mc-name">${mn}</div>
      <div class="mc-g">${m.games} GAME${m.games!==1?'S':''}</div>
    </div>`
  ).join('');
});

function showMap(mn) {
  const data = globalData;
  if (!data) return;
  const sd = getSeasonData(data);
  const m = sd.maps[mn];
  const { players } = data;
  if (!m) return;

  document.querySelectorAll('.map-card').forEach(c=>c.classList.remove('sel'));
  document.getElementById('mc-'+mn.replace(/[^a-z0-9]/gi,'_'))?.classList.add('sel');

  const sortedP = [...players].sort();
  const maxKills = Math.max(...players.map(p=>m.player_avg_kills[p]||0))||1;
  const maxScore = Math.max(...players.map(p=>m.player_avg_score[p]||0))||1;
  const mu_pairs = [['Blue','Red'],['Pink','Green'],['Gold','Brown']];
  const tw = m.team_win_pct||{};
  const mins = (m.avg_seconds/60).toFixed(1);

  const detailEl = document.getElementById('map-detail');

  const hillOff = m.hill_offense || 0;
  const hillDef = m.hill_defense || 0;
  const nonZone = Math.max(0, (m.total_kills || 0) - hillOff - hillDef);

  const offDefRatio = hillDef > 0 ? (hillOff/hillDef).toFixed(2) : (hillOff > 0 ? '∞' : '—');

  detailEl.innerHTML = `
    <div class="map-detail">
      <div class="map-detail-name">${mn}</div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px">
        ${[
          {v:m.games,               l:'GAMES PLAYED'},
          {v:m.avg_mov,             l:'AVG MOV'},
          {v:mins+'m',              l:'AVG GAME TIME'},
          {v:m.avg_kills_per_player,l:'AVG KILLS/PLAYER'},
          {v:m.avg_assists_pct+'%', l:'ASSIST %'},
          {v:offDefRatio,           l:'OFF/DEF RATIO'},
          {v:m.avg_betray_suicide,  l:'AVG BTR+SUI'},
        ].map(s=>`<div style="background:var(--surface);border:1px solid var(--border);border-top:2px solid var(--teal-dim);padding:6px 8px;text-align:center">
          <div style="font-family:var(--font-head);font-size:1rem;font-weight:700;color:var(--teal);text-shadow:0 0 8px var(--teal-glow);line-height:1">${s.v}</div>
          <div style="font-size:.55rem;letter-spacing:.1em;color:var(--text-dim);margin-top:3px">${s.l}</div>
        </div>`).join('')}
      </div>

      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">
        <div>
          <div class="section-hdr" style="margin-top:0"><div class="hex"></div><span>AVG KILLS ON MAP</span></div>
          <div style="position:relative;height:180px"><canvas id="detail-kills"></canvas></div>
        </div>
        <div>
          <div class="section-hdr" style="margin-top:0"><div class="hex"></div><span>AVG POINTS ON MAP</span></div>
          <div style="position:relative;height:180px"><canvas id="detail-pts"></canvas></div>
        </div>
        <div>
          <div class="section-hdr" style="margin-top:0"><div class="hex"></div><span>PLAYER WIN %</span></div>
          <div style="position:relative;height:180px"><canvas id="detail-pwp"></canvas></div>
        </div>
        <div>
          <div class="section-hdr" style="margin-top:0"><div class="hex"></div><span>TEAM WIN %</span></div>
          <div style="position:relative;height:180px"><canvas id="detail-twp"></canvas></div>
        </div>
        <div>
          <div class="section-hdr" style="margin-top:0"><div class="hex"></div><span>KILL STYLE</span></div>
          <canvas id="detail-ks" style="max-height:200px"></canvas>
        </div>
        <div>
          <div class="section-hdr" style="margin-top:0"><div class="hex"></div><span>KILL LOCATION</span></div>
          <canvas id="detail-kl" style="max-height:200px"></canvas>
        </div>
      </div>
    </div>`;

  // Helper for vertical bar charts in map detail
  function detailBar(id, labels, values, colors, suffix) {
    const canvas = document.getElementById(id);
    if (!canvas) return;
    new Chart(canvas, {
      type: 'bar',
      data: { labels, datasets: [{ data: values, backgroundColor: colors.map(c=>c+'bb'), borderColor: colors, borderWidth: 1 }] },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        plugins: {
          legend: { display: false },
          tooltip: { ...CHART_DEFAULTS.plugins.tooltip, callbacks: { label: ctx => ` ${ctx.parsed.y}${suffix||''}` } },
        },
        scales: {
          x: { ticks: { color:'#9ac8d8', font:{ family:'Share Tech Mono', size:11 } }, grid:{ color:'rgba(26,58,68,.35)' } },
          y: { ticks: { color:'#6090a2', font:{ family:'Share Tech Mono', size:11 }, callback: v => v+(suffix||'') }, grid:{ color:'rgba(26,58,68,.35)' } },
        },
      },
    });
  }

  const plrLabels = sortedP.map(p => dn(p, data));
  const plrColors = sortedP.map(p => pc(p, data));
  detailBar('detail-kills', plrLabels, sortedP.map(p=>m.player_avg_kills[p]||0), plrColors);
  detailBar('detail-pts',   plrLabels, sortedP.map(p=>m.player_avg_score[p]||0), plrColors);
  detailBar('detail-pwp',   plrLabels, sortedP.map(p=>m.player_win_pct[p]||0),   plrColors, '%');

  const teamLabels = mu_pairs.flat();
  const teamColors = teamLabels.map(tn => teamColor(tn, data));
  detailBar('detail-twp', teamLabels, teamLabels.map(tn=>tw[tn]||0), teamColors, '%');

  // Kill styles pie for map detail
  makePie('detail-ks',
    ['Weapon','Grenade','Melee','Other'].map((l,i)=>{
      const vals=[m.weapon_pct,m.grenade_pct,m.melee_pct,m.other_pct];
      return `${l}: ${vals[i]}%`;
    }),
    [m.weapon_pct,m.grenade_pct,m.melee_pct,m.other_pct],
    ['#4488ff','#ff6a00','#44dd88','#c088ff']
  );

  // Kill location pie for map detail
  const klTotal = hillOff + hillDef + nonZone || 1;
  makePie('detail-kl',
    [
      `Hill Offense: ${hillOff} (${(hillOff/klTotal*100).toFixed(1)}%)`,
      `Hill Defense: ${hillDef} (${(hillDef/klTotal*100).toFixed(1)}%)`,
      `Non-Zone: ${nonZone} (${(nonZone/klTotal*100).toFixed(1)}%)`,
    ],
    [hillOff, hillDef, nonZone],
    ['#ff9944','#44aaff','#888888']
  );
}
</script>
</body>
</html>
