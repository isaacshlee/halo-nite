<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halo Nite — Nites</title>
<link rel="stylesheet" href="css/halo.css">
<style>
.nite-card { background:var(--surface);border:1px solid var(--border);margin-bottom:8px; }
.nite-header { display:flex;align-items:center;gap:16px;padding:12px 16px;cursor:pointer;transition:background .12s; }
.nite-header:hover { background:var(--teal-glow2); }
.nite-header .nh-num { font-family:var(--font-head);font-size:1.3rem;font-weight:700;color:var(--teal);text-shadow:0 0 10px var(--teal-glow);min-width:80px; }
.nite-header .nh-meta { font-size:.73rem;letter-spacing:.15em;color:var(--text-dim); }
.nite-header .nh-icon { margin-left:auto;color:var(--text-dim);font-size:.78rem; }
.nite-body { display:none;border-top:1px solid var(--border); }
.nite-body.open { display:block; }
.sub-section { padding:12px 16px;border-bottom:1px solid var(--border2); }
.sub-section h4 { font-family:var(--font-head);font-size:.76rem;font-weight:600;letter-spacing:.22em;color:var(--text-dim);margin-bottom:8px; }
.game-log-tbl { width:100%;border-collapse:collapse;font-size:.82rem; }
.game-log-tbl th { font-family:var(--font-head);font-size:.68rem;font-weight:600;letter-spacing:.15em;color:var(--teal);padding:5px 8px;border-bottom:1px solid var(--border); }
.game-log-tbl td { padding:5px 8px;border-bottom:1px solid var(--border2); }
.game-log-tbl tr:last-child td { border-bottom:none; }
.summary-tbl { width:100%;border-collapse:collapse;font-size:.82rem; }
.summary-tbl th { font-family:var(--font-head);font-size:.68rem;font-weight:600;letter-spacing:.15em;color:var(--teal);padding:5px 8px;border-bottom:1px solid var(--border);text-align:right; }
.summary-tbl th:first-child { text-align:left; }
.summary-tbl td { padding:5px 8px;border-bottom:1px solid var(--border2);text-align:right; }
.summary-tbl td:first-child { text-align:left;color:var(--text-dim);font-size:.7rem;letter-spacing:.1em; }
.summary-tbl tr:last-child td { border-bottom:none; }
</style>
</head>
<body>
<div id="nav"></div>
<main>
<div id="loading"><span>LOADING MISSION DATA...</span></div>
<div id="content" style="display:none">
  <h1 class="page-title">Halo Nites</h1>
  <p class="page-subtitle" id="page-sub"></p>
  <div id="sh-nites"></div>
  <div id="nites-list"></div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="js/common.js"></script>
<script>
renderNav('nites.html', null);
loadStats().then(data => {
  renderNav('nites.html', data);
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';

  const sd = getSeasonData(data);
  const { players } = data;
  const { halo_nites } = sd;
  const isLifetime = getCurrentSeason() === 'Lifetime';
  const combineSui = sd.combine_suicides;

  document.getElementById('page-sub').textContent = `${getCurrentSeason()} — ${halo_nites.length} HALO NITES`;
  document.getElementById('sh-nites').innerHTML = sectionHdr('SELECT A HALO NITE');

  document.getElementById('nites-list').innerHTML = [...halo_nites].reverse().map(n => {
    const gCount = n.game_count;
    const maps = n.game_log.map(g=>g.map).join(', ');

    const suiHeader = combineSui
      ? `<th class="r">BTR+SUI</th>`
      : `<th class="r">BTR</th><th class="r">SUI</th>`;

    const suiRow = (ps) => combineSui
      ? `<td>${(ps.betrayals||0)+(ps.suicides||0)}</td>`
      : `<td>${ps.betrayals||0}</td><td>${ps.suicides||0}</td>`;

    const statsRows = [
      ['GAMES',    p=>n.player_stats[p]?.games||0],
      ['WINS',     p=>`<span class="good">${n.player_stats[p]?.wins||0}</span>`],
      ['LOSSES',   p=>`<span class="bad">${n.player_stats[p]?.losses||0}</span>`],
      ['W/L',      p=>{ const v=n.player_stats[p]?.wl_spread||0; return `<span class="${v>=0?'good':'bad'}">${v>0?'+':''}${v}</span>`; }],
      ['WIN%',     p=>fmtPct(n.player_stats[p]?.win_pct||0)],
      ['SET W',    p=>n.player_stats[p]?.set_wins||0],
      ['SET L',    p=>n.player_stats[p]?.set_losses||0],
      ['POINTS',   p=>n.player_stats[p]?.score||0],
      ['KILLS',    p=>n.player_stats[p]?.kills||0],
      ['ASSISTS',  p=>n.player_stats[p]?.assists||0],
      ['DEATHS',   p=>n.player_stats[p]?.deaths||0],
      ['K/D',      p=>{ const v=n.player_stats[p]?.kd_spread||0; return `<span class="${v>=0?'good':'bad'}">${v>0?'+':''}${v}</span>`; }],
      ['KC',       p=>(n.player_stats[p]?.kc||0).toFixed(1)],
      ['KC/D',     p=>{ const v=n.player_stats[p]?.kcd_spread||0; return `<span class="${v>=0?'good':'bad'}">${v>0?'+':''}${v.toFixed(1)}</span>`; }],
      ['AVG QIKE', p=>`<span class="teal">${(n.player_stats[p]?.avg_qike||0).toFixed(3)}</span>`],
      ['WPN K',    p=>n.player_stats[p]?.weapon_kills||0],
      ['GRN K',    p=>n.player_stats[p]?.grenade_kills||0],
      ['MEL K',    p=>n.player_stats[p]?.melee_kills||0],
      ['OTH K',    p=>n.player_stats[p]?.other_kills||0],
      ['MEDALS',   p=>n.player_stats[p]?.medals||0],
      ...(combineSui
        ? [['BTR+SUI', p=>(n.player_stats[p]?.betrayals||0)+(n.player_stats[p]?.suicides||0)]]
        : [['BETRAYALS', p=>n.player_stats[p]?.betrayals||0], ['SUICIDES', p=>n.player_stats[p]?.suicides||0]]),
    ];

    return `<div class="nite-card" id="nc-${n.nite_num}">
      <div class="nite-header" onclick="toggleNite(${n.nite_num})">
        <div class="nh-num">NITE ${n.nite_num}</div>
        <div class="nh-meta">${gCount} GAMES · ${maps.substring(0,60)}${maps.length>60?'...':''}</div>
        <div class="nh-icon" id="ni-${n.nite_num}">▶</div>
      </div>
      <div class="nite-body" id="nb-${n.nite_num}">
        <!-- Game log -->
        <div class="sub-section">
          <h4>GAME RECORD</h4>
          <table class="game-log-tbl">
            <thead><tr>
              <th>NITE G#</th><th>SEASON G#</th><th>MAP</th><th>MATCHUP</th><th>WINNER</th><th>TIME</th>
            </tr></thead>
            <tbody>
              ${n.game_log.map(g => {
                const wc = teamColor(g.winning_team, data);
                const mins=Math.floor(g.seconds_played/60), secs=g.seconds_played%60;
                return `<tr>
                  <td class="dim">${g.game_num_nite}</td>
                  <td class="dim">${g.game_num_season}</td>
                  <td>${g.map}</td>
                  <td class="dim">${g.matchup}</td>
                  <td>${teamBadge(g.winning_team, wc)}</td>
                  <td class="dim">${mins}:${String(secs).padStart(2,'0')}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>

        <!-- Player summary table -->
        <div class="sub-section">
          <h4>PLAYER SUMMARY</h4>
          <div class="tbl-wrap">
            <table class="summary-tbl">
              <thead><tr>
                <th>STAT</th>
                ${players.map(p => `<th class="r" style="color:${pc(p,data)}">${dn(p,data)}</th>`).join('')}
              </tr></thead>
              <tbody>
                ${statsRows.map(([label, valFn]) => `<tr>
                  <td>${label}</td>
                  ${players.map(p => `<td>${valFn(p)}</td>`).join('')}
                </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
});

function toggleNite(num) {
  const body = document.getElementById(`nb-${num}`);
  const icon = document.getElementById(`ni-${num}`);
  if (!body) return;
  const open = body.classList.toggle('open');
  icon.textContent = open ? '▼' : '▶';
}
</script>
</body>
</html>
