<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halo Nite — Nites</title>
<link rel="stylesheet" href="css/halo.css">
<style>
.nite-card { background:var(--surface);border:1px solid var(--border);margin-bottom:8px; }
.nite-header { display:flex;align-items:center;gap:16px;padding:12px 16px;cursor:pointer;transition:background .12s; }
.nite-header:hover { background:var(--teal-glow2); }
.nite-header .nh-num { font-family:var(--font-head);font-size:1.3rem;font-weight:700;color:var(--teal);text-shadow:0 0 10px var(--teal-glow);min-width:80px; }
.nite-header .nh-meta { font-size:.73rem;letter-spacing:.15em;color:var(--text-dim); }
.nite-header .nh-icon { margin-left:auto;color:var(--text-dim);font-size:.78rem; }
.nite-body { display:none;border-top:1px solid var(--border); }
.nite-body.open { display:block; }
.sub-section { padding:12px 16px;border-bottom:1px solid var(--border2); }
.sub-section h4 { font-family:var(--font-head);font-size:.76rem;font-weight:600;letter-spacing:.22em;color:var(--text-dim);margin-bottom:8px; }
.game-log-tbl { width:100%;border-collapse:collapse;font-size:.82rem; }
.game-log-tbl th { font-family:var(--font-head);font-size:.68rem;font-weight:600;letter-spacing:.15em;color:var(--teal);padding:5px 8px;border-bottom:1px solid var(--border); }
.game-log-tbl td { padding:5px 8px;border-bottom:1px solid var(--border2); }
.game-log-tbl tr:last-child td { border-bottom:none; }
.htbl { width:100%;border-collapse:collapse;font-size:.82rem;margin-bottom:8px; }
.htbl th { font-family:var(--font-head);font-size:.68rem;font-weight:600;letter-spacing:.15em;color:var(--teal);padding:5px 8px;border-bottom:1px solid var(--border);text-align:right; }
.htbl th:first-child { text-align:left; }
.htbl td { padding:5px 8px;border-bottom:1px solid var(--border2);text-align:right; }
.htbl td:first-child { text-align:left; }
.htbl tr:last-child td { border-bottom:none; }
</style>
</head>
<body>
<div id="nav"></div>
<main>
<div id="loading"><span>LOADING MISSION DATA...</span></div>
<div id="content" style="display:none">
  <h1 class="page-title">Halo Nites</h1>
  <p class="page-subtitle" id="page-sub"></p>
  <div id="sh-nites"></div>
  <div id="nites-list"></div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="js/common.js"></script>
<script>
renderNav('nites.html', null);

function _niteGradColor(val, min, max) {
  const t = max === min ? 0.5 : Math.max(0, Math.min(1, (val-min)/(max-min)));
  const r = Math.round(0xf8 + t*(0x4a-0xf8));
  const g = Math.round(0x71 + t*(0xde-0x71));
  const b = Math.round(0x71 + t*(0x80-0x71));
  return `rgb(${r},${g},${b})`;
}
function _niteGc(vals, val, inv=false) {
  const mn=Math.min(...vals), mx=Math.max(...vals);
  return inv ? _niteGradColor(val,mx,mn) : _niteGradColor(val,mn,mx);
}

loadStats().then(data => {
  renderNav('nites.html', data);
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';

  const sd = getSeasonData(data);
  const { players } = data;
  const { halo_nites } = sd;
  const isLifetime = isMultiSeasonView();
  const combineSui = sd.combine_suicides;

  document.getElementById('page-sub').textContent = `${getCurrentSeason()} — ${halo_nites.length} HALO NITES`;
  document.getElementById('sh-nites').innerHTML = sectionHdr('SELECT A HALO NITE');

  // Build timestamp lookup: game_num_season → date string
  const tsMap = {};
  sd.games.forEach(g => { if (g.timestamp) tsMap[g.game_num_season] = g.timestamp; });

  // Players in ascending alphabetical order by display name: Brundo, HD, Ike, Walsh
  const sortedPlayers = [...players].sort((a,b) => dn(a,data).localeCompare(dn(b,data)));

  document.getElementById('nites-list').innerHTML = [...halo_nites].reverse().map(n => {
    const gCount = n.game_count;
    const maps = n.game_log.map(g=>g.map).join(', ');

    // Get nite date from first game with timestamp
    let niteDate = '';
    for (const gl of n.game_log) {
      const ts = tsMap[gl.game_num_season];
      if (ts) { niteDate = ts.slice(0,10).replace(/-/g,'/'); break; }
    }

    // colSpecs: [{valueFn, inv?, format?, htmlFn?}]
    function htblGrad(headers, colSpecs) {
      const numVals = colSpecs.map(spec =>
        spec.htmlFn ? null : sortedPlayers.map(p => +spec.valueFn(n.player_stats[p]||{}) || 0)
      );
      return `<div class="tbl-wrap" style="margin-bottom:8px"><table class="htbl">
        <thead><tr>
          <th>PLAYER</th>
          ${headers.map(h=>`<th>${h}</th>`).join('')}
        </tr></thead>
        <tbody>
          ${sortedPlayers.map(p => {
            const ps = n.player_stats[p] || {};
            const c = pc(p, data);
            return `<tr>
              <td><span style="color:${c};font-family:var(--font-head);font-weight:600">${dn(p,data)}</span></td>
              ${colSpecs.map((spec, i) => {
                if (spec.htmlFn) return `<td>${spec.htmlFn(ps)}</td>`;
                const rawVal = +spec.valueFn(ps) || 0;
                const displayVal = spec.format ? spec.format(rawVal) : rawVal;
                const color = _niteGc(numVals[i], rawVal, !!spec.inv);
                return `<td><span style="color:${color}">${displayVal}</span></td>`;
              }).join('')}
            </tr>`;
          }).join('')}
        </tbody>
      </table></div>`;
    }

    const suiSpecs = combineSui
      ? [{ valueFn: ps=>(ps.betrayals||0)+(ps.suicides||0), inv:true }]
      : [{ valueFn: ps=>ps.betrayals||0, inv:true }, { valueFn: ps=>ps.suicides||0, inv:true }];
    const suiHdrs = combineSui ? ['BTR+SUI'] : ['BTR', 'SUI'];

    const t1Specs = [
      { valueFn: ps=>ps.wins||0 },
      { valueFn: ps=>ps.losses||0, inv:true },
      { valueFn: ps=>ps.wl_spread||0, format: v=>(v>0?'+':'')+v },
      { valueFn: ps=>ps.win_pct||0, format: v=>v.toFixed(1)+'%' },
      { valueFn: ps=>ps.score||0 },
      { valueFn: ps=>ps.kills||0 },
      { valueFn: ps=>ps.assists||0 },
      { valueFn: ps=>ps.deaths||0, inv:true },
      ...suiSpecs,
      { valueFn: ps=>ps.avg_qike||0, format: v=>v.toFixed(3) },
    ];

    const t2Specs = [
      { valueFn: ps=>ps.kd_spread||0, format: v=>(v>0?'+':'')+v },
      { valueFn: ps=>ps.kc||0, format: v=>Number(v).toFixed(1) },
      { valueFn: ps=>ps.kcd_spread||0, format: v=>(v>0?'+':'')+Number(v).toFixed(1) },
      { valueFn: ps=>{ const d=ps.deaths||0,k=ps.kills||0; return k/(d||1); }, format: v=>v.toFixed(2) },
      { valueFn: ps=>ps.weapon_kills||0 },
      { valueFn: ps=>ps.grenade_kills||0 },
      { valueFn: ps=>ps.melee_kills||0 },
      { valueFn: ps=>ps.other_kills||0 },
      { valueFn: ps=>ps.medals||0 },
    ];

    return `<div class="nite-card" id="nc-${n.nite_num}">
      <div class="nite-header" onclick="toggleNite(${n.nite_num})">
        <div class="nh-num">NITE ${n.nite_num}</div>
        <div class="nh-meta">${niteDate ? niteDate + ' · ' : ''}${gCount} GAMES · ${maps.substring(0,60)}${maps.length>60?'...':''}</div>
        <div class="nh-icon" id="ni-${n.nite_num}">▶</div>
      </div>
      <div class="nite-body" id="nb-${n.nite_num}">
        <!-- Game log -->
        <div class="sub-section">
          <h4>GAME RECORD</h4>
          <table class="game-log-tbl">
            <thead><tr>
              <th>NITE G#</th><th>SEASON G#</th><th>MAP</th><th>MATCHUP</th><th>WINNER</th><th>TIME</th>
            </tr></thead>
            <tbody>
              ${n.game_log.map(g => {
                const wc = teamColor(g.winning_team, data);
                const mins=Math.floor(g.seconds_played/60), secs=g.seconds_played%60;
                return `<tr>
                  <td class="dim">${g.game_num_nite}</td>
                  <td class="dim">${g.game_num_season}</td>
                  <td>${g.map}</td>
                  <td class="dim">${g.matchup}</td>
                  <td>${teamBadge(g.winning_team, wc)}</td>
                  <td class="dim">${mins}:${String(secs).padStart(2,'0')}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>

        <!-- Player summary tables -->
        <div class="sub-section">
          <h4>PLAYER SUMMARY</h4>
          ${htblGrad(['W','L','W/L','WIN%','PTS','K','A','D',...suiHdrs,'AVG QIKE'], t1Specs)}
          ${htblGrad(['K/D','KC','KC/D','KDR','WPN K','GRN K','MEL K','OTH K','MEDALS'], t2Specs)}
        </div>
      </div>
    </div>`;
  }).join('');
});

function toggleNite(num) {
  const body = document.getElementById(`nb-${num}`);
  const icon = document.getElementById(`ni-${num}`);
  if (!body) return;
  const open = body.classList.toggle('open');
  icon.textContent = open ? '▼' : '▶';
}
</script>
</body>
</html>
